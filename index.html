const rcard=r=>{const s=st(r),pg=S.prog[r.title]||0,lt=rmin(r.title),hid=!!S.rh[r.title];return `<article class="rc ${s==='Dropped'||hid?'dr':''}"><div><h3>${esc(r.title)}</h3>${r.author?`<div class="k" style="margin-top:2px">${esc(r.author)}</div>`:''}</div><div class="tags"><span class="tag o">${esc(r.cat)}</span><span class="tag">${r.kind==='Book'?'Book':r.kind==='Lab'?'Lab':r.custom?'Course':'YouTube'}</span><span class="tag ${stTag(s)}">${s}</span>${hid?'<span class="tag x">hidden</span>':''}${r.edited?'<span class="tag x">edited</span>':''}</div>${S.q.libNote?`<p>${esc(r.note)}</p>`:'<span style="flex:1"></span>'}<div class="pgw"><input type="range" min="0" max="100" step="5" value="${pg}" data-pg="${esc(r.title)}" aria-label="Progress"><span class="pv">${pg}%</span></div><div class="k" style="font:.72rem var(--nf)">${lt?fm(lt)+' focused · ':''}opened ${ago(S.opened[r.title])}</div><div class="rb"><select class="ss" data-st="${esc(r.title)}" aria-label="Status">${['Planned','In progress','Completed','Dropped'].map(o=>`<option${o===s?' selected':''}>${o}</option>`).join('')}</select><span class="acts"><button class="btn s g" data-a="focusres" data-t="${esc(r.title)}" aria-label="Focus on this resource">${ic('focus')}</button><button class="btn s g" data-a="editres" data-t="${esc(r.title)}" aria-label="Edit resource">${ic('edit')}</button><button class="btn s g" data-a="hideres" data-t="${esc(r.title)}" aria-label="${hid?'Unhide':'Hide'} resource">${ic(hid?'eye':'eyeoff')}</button>${r.custom?`<button class="btn s g" data-a="delres" data-t="${esc(r.title)}" aria-label="Delete resource">${ic('trash')}</button>`:''}<a class="btn s p" href="${esc(r.url)}" target="_blank" rel="noopener" data-open="${esc(r.title)}">Open ${ic('ext')}</a></span></div></article>`};
const libList=()=>{const a=libItems();return `<div class="k" style="margin-bottom:14px;font:.75rem var(--nf)">${a.length} / ${libBase().length} resources</div>`+(a.length?`<div class="rg">${a.map(rcard).join('')}</div>`:emptyHint('No matches','Clear a filter or add your own resource.'))};
function library(){const R=allR(),n=s=>R.filter(r=>st(r)===s).length,hn=Object.keys(S.rh).length;return `<div class="head"><div><h1 class="t">Library</h1><p class="sub">${n('In progress')} in progress, ${n('Completed')} completed. Edit, hide or add anything. Courses are YouTube, labs are hands-on practice, books cover people and psychology.</p></div><button class="btn p" data-a="addres">${ic('plus')}Add resource</button></div>
<div class="tb"><div class="seg" role="group" aria-label="Type">${[['All','All'],['Course','Courses'],['Lab','Labs'],['Book','Books']].map(([v,l])=>`<button data-k="${v}" class="${lk===v?'on':''}">${l}</button>`).join('')}</div><input id="lq" type="search" placeholder="Search title, author or topic" value="${esc(lq)}" aria-label="Search library"><select id="lc" aria-label="Category">${['All',...CATS].map(c=>`<option${c===lc?' selected':''}>${c}</option>`).join('')}</select><select id="ls" aria-label="Status">${['All','Planned','In progress','Completed','Dropped'].map(c=>`<option${c===ls?' selected':''}>${c}</option>`).join('')}</select><select id="lsort" aria-label="Sort">${[['title','Sort: title'],['category','Sort: category'],['status','Sort: status'],['progress','Sort: progress'],['recent','Sort: recently opened'],['time','Sort: time focused']].map(([v,l])=>`<option value="${v}"${S.q.libSort===v?' selected':''}>${l}</option>`).join('')}</select><button class="btn ${showHid?'p':''}" data-a="toghid">${ic(showHid?'eye':'eyeoff')}Hidden ${hn}</button></div><div id="ll">${libList()}</div>
<div class="note">Course links open the creator’s YouTube channel, playlist or a search for the series, so you can pick what fits your level. Labs and platforms are free to start. Practise security and reverse engineering only on systems, labs and samples you own or are authorised to test. The dangerous-people books are for recognising red flags and protecting yourself. Describe behaviour and leave diagnosis to clinicians.</div>`}

function skillCard(s,A){const z=sks(s),lock=z==='Locked',pre=(s.pre||[]).map(p=>(A.find(x=>x.id===p)||{}).n).filter(Boolean),rs=(s.rs||[]).filter(t=>allR().some(r=>r.title===t));return `<article class="sc ${lock?'lock':''} ${z==='Proven'?'ok':''}"><div class="acts" style="justify-content:space-between"><span class="tag o">${esc(s.d)}</span><span class="tag ${stTag(z)}">${z}</span></div><h3>${esc(s.n)}</h3><p>${esc(s.t)}</p>${pre.length?`<div class="f"><b>Needs:</b> ${esc(pre.join(', '))}</div>`:''}<div class="f"><b>Proof:</b> ${esc(s.proof)}</div>${rs.length?`<div class="f"><b>Learn from:</b></div><div class="rls">${rs.map(t=>`<button class="rl" data-a="findres" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}${s.res?`<div class="f"><b>Also:</b> ${esc(s.res)}</div>`:''}<div class="acts">${lock?`<button class="btn s" disabled>Locked</button>`:z==='Proven'?`<button class="btn s" data-a="sview" data-id="${esc(s.id)}">View proof</button><button class="btn s g" data-a="sreopen" data-id="${esc(s.id)}">Reopen</button>`:z==='In progress'?`<button class="btn s p" data-a="sproof" data-id="${esc(s.id)}">Submit proof</button>`:`<button class="btn s p" data-a="sstart" data-id="${esc(s.id)}">Start</button>`}<button class="btn s g" data-a="editskill" data-id="${esc(s.id)}" aria-label="Edit skill">${ic('edit')}</button>${s.custom?`<button class="btn s g" data-a="sdel" data-id="${esc(s.id)}" aria-label="Delete skill">${ic('trash')}</button>`:`<button class="btn s g" data-a="hidesk" data-id="${esc(s.id)}" aria-label="Hide skill">${ic('eyeoff')}</button>`}</div></article>`}
function skills(){const A=SKS(),c=s=>A.filter(x=>sks(x)===s).length,ar=['All',...new Set(A.map(s=>s.d))];if(!ar.includes(sf))sf='All';const ns=nextSkill(),order=[1,2,3,4,5,0];
const phs=order.map(i=>({i,p:PH[i],all:A.filter(s=>(s.ph??5)===i),items:A.filter(s=>(s.ph??5)===i&&(sf==='All'||s.d===sf))})).filter(x=>x.items.length);
return `<div class="head"><div><h1 class="t">Roadmap</h1><p class="sub">${c('Proven')} of ${A.length} skills proven. Work down the phases. A skill unlocks when its prerequisites are proven, and proof means something you built or did, not something you watched.</p></div><button class="btn p" data-a="addskill">${ic('plus')}Add skill</button></div>
${ns?`<div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div><h2>Next step</h2><div style="font:600 1rem var(--hf);margin:6px 0 2px">${esc(ns.n)}</div><div class="k" style="max-width:60ch">${esc(ns.t)}</div></div><div class="acts">${sks(ns)==='Ready'?`<button class="btn p" data-a="sstart" data-id="${esc(ns.id)}">Start</button>`:`<button class="btn p" data-a="sproof" data-id="${esc(ns.id)}">Submit proof</button>`}</div></div>`:''}
<div class="stats"><div class="card stat"><b data-cu="${c('Proven')}">${c('Proven')}</b><span>proven of ${A.length}</span></div><div class="card stat"><b data-cu="${c('Ready')}">${c('Ready')}</b><span>ready</span></div><div class="card stat"><b data-cu="${c('In progress')}">${c('In progress')}</b><span>in progress</span></div><div class="card stat"><b data-cu="${c('Locked')}">${c('Locked')}</b><span>locked</span></div></div>
<div class="tb" style="margin-top:20px"><div class="seg" role="group" aria-label="Area">${ar.map(v=>`<button data-sf="${esc(v)}" class="${sf===v?'on':''}">${esc(v)}</button>`).join('')}</div></div>
${phs.map(x=>{const pv=x.all.filter(s=>sks(s)==='Proven').length;return `<div class="ph"><div><h2>${x.i?`Phase ${x.i} · ${esc(x.p[0])}`:esc(x.p[0])}</h2><div class="k">${esc(x.p[1])}</div></div><div class="acts"><span class="k" style="font:.75rem var(--nf)">${pv}/${x.all.length}</span><div class="bar-t"><i style="width:${x.all.length?pv/x.all.length*100:0}%"></i></div></div></div><div class="sg">${x.items.map(s=>skillCard(s,A)).join('')}</div>`}).join('')}`}

function jfilter(){const q=jq.toLowerCase();return S.notes.filter(n=>(jt==='All'||n.tag===jt)&&(!q||`${n.title} ${n.body} ${n.next}`.toLowerCase().includes(q))).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.at.localeCompare(a.at))}
function jlist(){const a=jfilter();if(!S.notes.length)return `<div class="empty"><b>No entries yet</b>Write one thing you learned or noticed today.<button class="btn p" data-a="newnote">New entry</button></div>`;if(!a.length)return emptyHint('No entries match','Try a different search or tag.');
return `<div class="card">${a.map(n=>`<div class="le"><div class="row"><div><h3>${n.pin?'▪ ':''}${esc(n.title)}</h3><div class="tags" style="margin-top:7px"><span class="tag o">${esc(n.tag)}</span></div></div><small>${new Date(n.at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</small></div>${n.body?`<p>${esc(n.body)}</p>`:''}${n.next?`<p><span class="k">next: </span>${esc(n.next)}</p>`:''}<div class="acts" style="margin-top:12px"><button class="btn s g" data-a="editnote" data-id="${esc(n.id)}">${ic('edit')}Edit</button><button class="btn s g" data-a="pinnote" data-id="${esc(n.id)}">${ic('pin')}${n.pin?'Unpin':'Pin'}</button><button class="btn s g" data-a="delnote" data-id="${esc(n.id)}">${ic('trash')}Delete</button></div></div>`).join('')}</div>`}
function journal(){return `<div class="head"><div><h1 class="t">Journal</h1><p class="sub">${S.notes.length} ${S.notes.length===1?'entry':'entries'}. Write what you learned, what you noticed in people, and the next step. Stored only in this browser.</p></div><div class="acts"><button class="btn" data-a="expmd">${ic('dl')}Export .md</button><button class="btn p" data-a="newnote">${ic('plus')}New entry</button></div></div>
<div class="tb"><input id="jq" type="search" placeholder="Search entries" value="${esc(jq)}" aria-label="Search entries"><select id="jt" aria-label="Tag">${['All',...new Set([...areas(),...S.notes.map(n=>n.tag)])].map(c=>`<option${c===jt?' selected':''}>${esc(c)}</option>`).join('')}</select></div><div id="jl">${jlist()}</div>`}

function insights(){const days=lastDays(ir),mv=days.map(d=>mins(d.k)),tot=mv.reduce((a,b)=>a+b,0),goal=+S.goal||180,mx=Math.max(goal,...mv),ss=S.sessions.filter(s=>s.mode==='focus'&&days.some(d=>d.k===s.date)),pv=SKS().filter(s=>sks(s)==='Proven').length,pa=days.filter(d=>(S.practice[d.k]||[]).length).length,bi=mv.indexOf(Math.max(...mv)),tl=S.tlog.filter(l=>days.some(d=>d.k===l.date)),onTime=tl.filter(l=>!l.rolled).length,stuck=S.tasks.filter(t=>!t.done&&(t.rolled||0)>=S.q.stuck).sort((a,b)=>(b.rolled||0)-(a.rolled||0)).slice(0,5);
const ab={};ss.forEach(s=>{const m=ms(s.date).find(x=>x.id===s.mid),tk=s.tid&&S.tasks.find(x=>x.id===s.tid),a=m?m.kind:(tk&&tk.area)||'Free focus';ab[a]=(ab[a]||0)+s.min});const abe=Object.entries(ab).sort((x,y)=>y[1]-x[1]),abm=Math.max(1,...abe.map(x=>x[1]));
const rs={};S.sessions.forEach(s=>{if(s.res)rs[s.res]=(rs[s.res]||0)+s.min});const rse=Object.entries(rs).sort((x,y)=>y[1]-x[1]).slice(0,5);
const wks=20,tot2=wks*7,start=nowD();start.setDate(start.getDate()-(tot2-1));const pad=(start.getDay()-S.q.wk+7)%7,cells=[...Array(pad)].map(()=>'<i class="n"></i>');lastDays(tot2).forEach(d=>{const m=mins(d.k),l=!m?0:m<=goal*.25?1:m<=goal*.5?2:m<=goal?3:4;cells.push(`<i class="l${l}" data-tip="${d.d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${m} min"></i>`)});
return `<div class="head"><div><h1 class="t">Insights</h1><p class="sub">Everything below is computed from your missions, tasks, focus sessions, practices and journal.</p></div><div class="seg" role="group" aria-label="Range">${[7,30,90].map(n=>`<button data-ir="${n}" class="${ir===n?'on':''}">${n} days</button>`).join('')}</div></div>
<div class="stats"><div class="card stat"><b data-cu="${streak()}">${streak()}</b><span>current streak</span></div><div class="card stat"><b data-cu="${best()}">${best()}</b><span>best streak</span></div><div class="card stat"><b data-cu="${tot}">${tot}</b><span>minutes in range</span></div><div class="card stat"><b data-cu="${ss.length}">${ss.length}</b><span>focus sessions</span></div></div>
<div class="stats"><div class="card stat"><b data-cu="${Math.round(tot/ir)}">${Math.round(tot/ir)}</b><span>avg minutes per day</span></div><div class="card stat"><b>${mv[bi]?days[bi].d.toLocaleDateString(undefined,{weekday:'short'}).toLowerCase():'-'}</b><span>best day, ${mv[bi]||0} min</span></div><div class="card stat"><b data-cu="${tl.length}">${tl.length}</b><span>tasks completed</span></div><div class="card stat"><b data-cu="${pv}">${pv}</b><span>skills proven</span></div></div>
<div class="card" style="margin-bottom:12px"><h2>Minutes per day</h2><div class="k">goal: ${goal} min</div><div class="bars" style="--dn:${ir>7?1:0}">${days.map((d,i)=>`<div class="bar ${i===ir-1?'td':''}" data-tip="${d.d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${mv[i]} min"><em>${ir===7&&mv[i]?mv[i]:''}</em><div class="trk"><i style="height:${Math.max(1,mv[i]/mx*100)}%"></i></div><small>${ir===7?d.d.toLocaleDateString(undefined,{weekday:'short'}).toLowerCase():''}</small></div>`).join('')}</div></div>
<div class="card" style="margin-bottom:12px"><h2>Consistency</h2><div class="k">Last ${wks} weeks. Darker means closer to or above your daily goal.</div><div class="hm">${cells.join('')}</div></div>
<div class="grid2" style="margin-bottom:12px"><div class="card"><h2>Tasks</h2><div class="k">${tl.length} completed in ${ir} days, ${onTime} without being carried over.</div>${stuck.length?`<div style="margin-top:10px">${stuck.map(t=>`<div class="kv"><span style="color:var(--tx)">${esc(t.title)}</span><b class="acts" style="flex-wrap:nowrap">carried ${t.rolled}d <button class="btn s g" data-a="tedit" data-id="${esc(t.id)}" aria-label="Edit task">${ic('edit')}</button><button class="btn s g" data-a="tmovem" data-id="${esc(t.id)}" aria-label="Move task">${ic('skip')}</button></b></div>`).join('')}</div>`:`<div class="k" style="padding:12px 0">Nothing is stuck. Anything carried several days will show up here.</div>`}</div><div class="card"><h2>Focus by area</h2><div class="k">Last ${ir} days</div>${abe.length?abe.map(([a,m])=>`<div class="hb"><span>${esc(a)}</span><div class="bar-t"><i style="width:${m/abm*100}%"></i></div><span>${fm(m)}</span></div>`).join(''):`<div class="k" style="padding:14px 0">No focus sessions in this range yet.</div>`}</div></div>
<div class="card" style="margin-bottom:12px"><h2>Most-studied resources</h2><div class="k">All time</div>${rse.length?rse.map(([a,m])=>`<div class="hb" style="grid-template-columns:1fr 70px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a)}</span><span>${fm(m)}</span></div>`).join(''):`<div class="k" style="padding:14px 0">Pick a resource as the target of a focus session to see it here.</div>`}</div>
<div class="card"><div class="head" style="margin:0 0 6px"><div><h2>Daily practices</h2><div class="k">${(S.practice[dk()]||[]).length} of ${PRS().length} done today, ${pa} practice days in this range. Pick one or two, not all.</div></div><button class="btn s" data-a="addprac">${ic('plus')}Add</button></div><div style="margin-top:6px">${PRS().map(p=>{const on=(S.practice[dk()]||[]).includes(p.id);return `<div class="pr"><button class="chk ${on?'on':''}" data-a="prac" data-id="${esc(p.id)}" aria-label="${on?'Unmark':'Mark'}: ${esc(p.n)}">${ic('check')}</button><div><div class="mt">${esc(p.n)} <span class="tag" style="margin-left:6px">${esc(p.d)}</span></div><div class="md">${esc(p.t)}</div></div>${p.custom?`<button class="btn s g" data-a="pdel" data-id="${esc(p.id)}" aria-label="Delete practice">${ic('trash')}</button>`:'<span></span>'}</div>`}).join('')}</div></div>`}

const num=(k,min,max,u='',st0=1)=>`<input class="nb" type="number" data-q="${k}" data-num="1" min="${min}" max="${max}" step="${st0}" value="${S.q[k]}" aria-label="${k}">${u?`<span class="k">${u}</span>`:''}`;

const ACCS=[['auto','Auto'],['#ffffff','White'],['#f5b942','Amber'],['#4ade80','Green'],['#38bdf8','Cyan'],['#a78bfa','Violet'],['#fb7185','Rose']];
const KNAMES={task:'Quick add task',search:'Library search',note:'New journal entry',sound:'Toggle sound',focus:'Start or pause timer',zen:'Zen mode'};
const stabs=[['general','General'],['tasks','Tasks and reminders'],['content','Content and roadmap'],['appearance','Appearance'],['cursor','Cursor'],['sound','Sound'],['focus','Focus timer'],['missions','Daily missions'],['keys','Shortcuts'],['data','Data']];
function sGeneral(){return `<div class="card"><div class="grp">Profile</div>${row('Name','Used in your greeting.',`<input data-s="name" maxlength="28" value="${esc(S.name)}" aria-label="Name">`)}${row('Daily goal','Minutes of focused work per day.',`<input class="nb" type="number" data-s="goal" min="15" max="900" value="${+S.goal||180}" aria-label="Daily goal"><span class="k">min</span>`)}${row('Streak threshold','Minutes needed for a day to count toward your streak.',num('streakMin',1,600,'min'))}${row('Week starts on','Used for the consistency calendar.',sel('wk',[[1,'Monday'],[0,'Sunday'],[6,'Saturday']]))}${row('Start page','Where lifeos opens when there is no link.',sel('start',[['today','Today'],['focus','Focus'],['library','Library'],['skills','Skills'],['journal','Journal'],['insights','Insights'],['last','Last page visited']]))}</div>
<div class="card" style="margin-top:16px"><div class="grp">Greeting</div>${[['m','Morning (5 to 12)'],['a','Afternoon (12 to 18)'],['e','Evening (18 to 24)'],['n','Late night (0 to 5)']].map(([k,l])=>row(l,'Your name is added after the text.',`<input data-g="${k}" maxlength="40" value="${esc(S.q.greet[k])}" aria-label="${l}">`)).join('')}</div>
<div class="card" style="margin-top:16px"><div class="grp">Clock</div>${row('Show clock','In the top bar.',swc('clock'))}${row('Show seconds','',swc('secs'))}${row('24-hour time','Off uses AM/PM.',swc('h24'))}</div>
<div class="card" style="margin-top:16px"><div class="grp">Areas</div><div class="k">Areas label missions, journal entries and skills. Removing one does not delete anything tagged with it.</div><div class="chips">${areas().map(a=>`<span class="chip">${esc(a)}${areas().length>1?`<button data-a="delarea" data-id="${esc(a)}" aria-label="Remove ${esc(a)}">${ic('x')}</button>`:''}</span>`).join('')}</div><div class="acts" style="flex-wrap:nowrap"><input id="areain" maxlength="20" placeholder="New area" aria-label="New area"><button class="btn" data-a="addarea">${ic('plus')}Add</button></div></div>
<div class="card" style="margin-top:16px"><div class="grp">Library</div>${row('Default sort','',sel('libSort',[['title','Title'],['category','Category'],['status','Status'],['progress','Progress'],['recent','Recently opened'],['time','Time focused']]))}${row('Show descriptions','',swc('libNote'))}${row('Card width','Minimum width of library cards.',rng('libMin',240,480,10,'px'))}</div>

function tlist(){const t0=dk(),open=S.tasks.filter(t=>!t.done);
if(tv==='done')return tdoneList();
